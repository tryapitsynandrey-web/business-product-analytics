[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-product-analytics"
version = "0.1.0"
description = "ProductPulse business product analytics decision engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ProductPulse contributors" }
]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
productpulse = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
  "adapters",
  "core",
  "core.business_health",
  "models",
  "utils",
  "app",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
app = "app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
project-includes = ["src", "tests", "app"]
project-excludes = [
  ".venv",
  ".git",
  "__pycache__",
  ".pytest_cache",
  "data",
  "reports"
]
