[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-product-analytics"
version = "0.1.0"
description = "ProductPulse business product analytics decision engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ProductPulse contributors" }
]
keywords = [
  "analytics",
  "business-intelligence",
  "saas-metrics",
  "churn-prediction",
  "kpi-dashboard",
  "data-governance",
  "revenue-analytics",
  "decision-engine",
  "python-analytics",
  "streamlit-dashboard",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=5.0.0",
  "pyrefly>=0.20.0",
  "ruff>=0.8.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
productpulse = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
  "adapters",
  "core",
  "core.business_health",
  "models",
  "utils",
  "app",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
app = "app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "data",
  "reports",
  "notebooks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["src", "app"]
omit = [
  "app/streamlit_app.py",
  "app/ui_helpers.py",
  "app/ui_renderers.py",
  "app/views_*.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_also = [
  'if __name__ == "__main__":',
]

[tool.pyrefly]
search-path = ["src", ".", "app"]
project-includes = ["src", "tests", "app"]
project-excludes = [
  ".venv",
  ".git",
  "__pycache__",
  ".pytest_cache",
  "data",
  "reports"
]

[tool.mypy]
mypy_path = "src"

